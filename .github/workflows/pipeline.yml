name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate index.html

      - name: Build Docker image
        run: docker build -t lab-test .

      - name: Smoke test container
        run: |
          docker run -d --name test-site -p 8080:80 lab-test
          sleep 3
          curl -fsS http://localhost:8080 | grep -q "ТВОЁ ФИО"
          echo "OK"

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
